name: Docker Build, Push, and Deploy to EC2

on:
  push:
    branches: [ week02 ]

jobs:
  # Job 1: Build and Push to Docker Hub
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
        labels: |
          build.source=github-actions
          build.workflow=Docker Build, Push, and Deploy
          build.run_id=${{ github.run_id }}
          org.opencontainers.image.revision=${{ github.sha }}

  # Job 2: Deploy to EC2 via SSM
  deploy:
    runs-on: ubuntu-latest
    needs: build  # This job runs only after 'build' succeeds
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Deploy to EC2 via SSM
      run: |
        echo "Deploying to EC2 instance: ${{ secrets.EC2_INSTANCE_ID }}"
        
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy Docker container from GitHub Actions" \
          --parameters 'commands=[
            "echo Starting deployment...",
            "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest",
            "docker stop cs6620-app || true",
            "docker rm cs6620-app || true",
            "docker run -d --name cs6620-app -p 80:5000 --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest",
            "docker ps",
            "echo Deployment completed!"
          ]' \
          --output text
        
        echo "Deployment command sent successfully!"
    
    - name: Wait and check deployment
      run: |
        echo "Waiting for deployment to complete..."
        sleep 20
        echo "Check AWS Systems Manager Run Command for execution status"
