name: Docker Build, Push, and Deploy

on:
  push:
    branches: [ week02 ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
        labels: |
          build.source=github-actions
          build.workflow=Docker Build, Push, and Deploy
          build.run_id=${{ github.run_id }}
          org.opencontainers.image.revision=${{ github.sha }}

  deploy-to-ec2-via-ssm:
    runs-on: ubuntu-latest
    needs: build-and-push  # 只在 build-and-push job 成功後運行
    
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}
    
    - name: Deploy to EC2 via SSM
      id: ssm-deploy
      run: |
        echo "Starting deployment to EC2 instance: ${{ secrets.EC2_INSTANCE_ID }}"
        
        # Send deployment commands to EC2
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy Docker container from GitHub Actions" \
          --parameters 'commands=[
            "echo \"=== Starting Docker deployment ===\"",
            "echo \"Pulling latest image...\"",
            "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest",
            "echo \"Stopping existing container if running...\"",
            "docker stop cs6620-app 2>/dev/null || true",
            "echo \"Removing old container...\"",
            "docker rm cs6620-app 2>/dev/null || true",
            "echo \"Starting new container...\"",
            "docker run -d --name cs6620-app -p 80:5000 --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest",
            "echo \"Verifying deployment...\"",
            "docker ps | grep cs6620-app",
            "echo \"=== Deployment completed ===\""
          ]' \
          --output text \
          --query "Command.CommandId")
        
        echo "Command ID: $COMMAND_ID"
        echo "command-id=$COMMAND_ID" >> $GITHUB_OUTPUT
        
        # Wait for command to complete (with timeout)
        echo "Waiting for deployment to complete..."
        sleep 10
        
        # Check command status
        STATUS=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
          --output text \
          --query "Status" 2>/dev/null || echo "InProgress")
        
        echo "Command status: $STATUS"
        
        if [ "$STATUS" = "Success" ]; then
          echo "Deployment successful!"
        elif [ "$STATUS" = "InProgress" ]; then
          echo "Deployment still in progress. Check AWS Systems Manager for details."
        else
          echo "Deployment may have issues. Status: $STATUS"
          echo "Check AWS Systems Manager Run Command for details."
        fi
    
    - name: Display deployment information
      run: |
        echo "Deployment Summary:"
        echo "- EC2 Instance ID: ${{ secrets.EC2_INSTANCE_ID }}"
        echo "- Docker Image: ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest"
        echo "- Command ID: ${{ steps.ssm-deploy.outputs.command-id }}"
        echo "- Timestamp: $(date)"
        echo ""
        echo "Next steps:"
        echo "1. Check AWS Systems Manager > Run Command for execution details"
        echo "2. Visit your application at: http://<your-ec2-public-ip>"
        echo "3. SSH to EC2 and run 'docker ps' to verify container is running"
